name: Test
on: [push] 

jobs:
  tests-on-unix:
    name: Tests on Unix
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - oldstable
          - stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: |
          set -o pipefail  # tee must not hide a test failure
          go test -race -shuffle=on -coverprofile=coverage.out ./... | tee test-output.txt
      - name: Coverage summary
        if: matrix.go-version == 'stable'
        run: |
          {
            echo "### Coverage"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            # skipped rows can never be meaningful: (root) is main.go wiring, consts has only constants,
            # test and trakt/trakttest are test helpers; the total still covers every package
            awk -v skip=" (root) consts test trakt/trakttest " '/coverage:/ { p = ""; c = ""; for (i = 1; i <= NF; i++) { if ($i ~ /^github\.com\//) p = $i; if ($i == "coverage:") c = $(i+1) } sub("^github.com/mfederowicz/trakt-sync/?", "", p); if (p == "") p = "(root)"; if (index(skip, " " p " ")) next; print "| `" p "` | " c " |" }' test-output.txt
            echo
            echo "**Total:** $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
          } >> "$GITHUB_STEP_SUMMARY"
  
      - name: Build examples
        working-directory: example
        run: |
          go vet ./...
          go build ./...

  library-on-go-minimum:
    name: Library on the go.mod Go version
    runs-on: ubuntu-26.04
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test library packages
        run: |
          go version
          go vet ./trakt/... ./str ./uri
          go test -race ./trakt/... ./str ./uri
      - name: Build examples
        working-directory: example
        run: |
          go vet ./...
          go build ./...
